# Shared defaults and ref rules for every aioz-ci-template profile.
#
# Included by every profile. Holds the tool pins and the one rule set, so a
# version bump of a scanner is a one-line change here rather than a change in
# every consuming repository.
#
# Every variable below is a default. A consuming repository overrides any of
# them in its own top-level `variables:` block, which takes precedence over an
# included one.

variables:
  # Go image for lint, test and govulncheck.
  #
  # Must be go1.25.13 or later: govulncheck checks the standard library as well
  # as the module graph, and go1.25.8 has ten reachable stdlib vulnerabilities
  # (net/http, crypto/tls, crypto/x509, html/template and more).
  # registry:5000/go:1.25 was rebuilt on go1.25.14 on 2026-09-13.
  GO_IMAGE: "registry:5000/go:1.25"

  # Must be a v2.x release. A v2-schema .golangci.yml (`version: "2"`) is
  # rejected by a v1 binary with `can't load config: the format is required`.
  GOLANGCI_LINT_VERSION: "v2.12.2"

  # v1.7.0 is the newest govulncheck that runs on Go 1.25; v1.8.0 requires 1.26
  # and would download a toolchain on every run. Move this with GO_IMAGE.
  GOVULNCHECK_VERSION: "v1.7.0"

  # Scanner images, pinned by digest: a tag can be moved, a digest cannot, so
  # the same pipeline config keeps scanning with the same scanner.
  GITLEAKS_IMAGE: "zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f"
  TRIVY_IMAGE: "aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969"
  HADOLINT_IMAGE: "hadolint/hadolint:v2.15.1-alpine@sha256:a1d49ae1a4e83c1dbad26b8c1ad7588c8bd1e04f4866b34ad3cac50335198552"

  # Build tags the repository compiles under, e.g. `purego`. Empty by default,
  # and the -tags flag is omitted entirely when empty: `-tags ""` is not the
  # same thing as no -tags at all for some toolchain versions.
  BUILD_TAGS: ""

  # Runner tag. The shared runner is `linux`.
  RUNNER_TAG: "linux"

  # Submodules are separate modules with their own pipelines. Checking them out
  # would need an SSH key that these jobs deliberately do not have.
  GIT_SUBMODULE_STRATEGY: "none"

  # Directories trivy does not walk. The cache lives in the workspace, so it
  # would otherwise scan its own downloads.
  TRIVY_SKIP_DIRS: ".cache"

  # Module path prefixes that must not go to proxy.golang.org. Used only by
  # .aioz-go-private, which is opt-in.
  GO_PRIVATE_HOSTS: "gitlab.internal/,10.0.0.50/"

  # Optional commands, run by the test job only when set. Unset means skipped,
  # and the job says so in its log rather than failing.
  #   GENERATE_VERIFY_CMD: fails if generated output (swagger, proto) is stale
  #   TEST_BUILD_CMD:      compiles test code behind build tags `make test` skips
  GENERATE_VERIFY_CMD: ""
  TEST_BUILD_CMD: ""

# When the shared jobs run: merge requests, the default branch, and tags.
#
# A tag pipeline checks too, or a release ships unverified.
#
# A repository needing other refs (aioz-stream also uses develop* and stag)
# redefines `rules:` on the job. Note that GitLab REPLACES a redefined
# `rules:` rather than merging it, so such a repository must list every ref it
# wants, including the three below.
.aioz-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
